name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            throw 'gofmt changes are required.'
          }

      - name: Verify module files
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify generated resources
        shell: pwsh
        run: |
          go run ./internal/buildresources ./cmd/dkdrive/resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Resource generation failed.' }
          git diff --exit-code -- cmd/dkdrive/resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Generated resources are stale.' }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-H=windowsgui" -o bin/dkdrive.exe ./cmd/dkdrive

      - name: Package and verify archive
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          $archive = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $expectedZip = (Get-Content "$($archive.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expectedZip) { throw 'ZIP checksum mismatch.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/verify
          $expectedExe = (Get-Content dist/verify/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash dist/verify/dkdrive.exe -Algorithm SHA256).Hash -ne $expectedExe) { throw 'EXE checksum mismatch.' }
          $info = Get-Content dist/verify/build-info.json -Raw | ConvertFrom-Json
          if ($info.modified) { throw 'Package was built from a modified checkout.' }

          $product = (Get-Item dist/verify/dkdrive.exe).VersionInfo
          if ($product.ProductName -ne 'DK-Drive' -or $product.CompanyName -ne '참빛바다') { throw 'Product identity mismatch.' }
          if ($product.ProductVersion -ne $info.version -or $product.FileVersion -ne "$($info.version).0") { throw 'Version resource mismatch.' }
          $numeric = "$($product.FileMajorPart).$($product.FileMinorPart).$($product.FileBuildPart).$($product.FilePrivatePart)"
          if ($numeric -ne "$($info.version).0") { throw 'Numeric file version mismatch.' }
