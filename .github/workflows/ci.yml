name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            throw 'gofmt changes are required.'
          }

      - name: Verify module files
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify generated resources
        shell: pwsh
        run: |
          go run ./internal/buildresources ./cmd/dkdrive/resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Resource generation failed.' }
          git diff --exit-code -- cmd/dkdrive/resource_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'Generated resources are stale.' }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags="-H=windowsgui" -o bin/dkdrive.exe ./cmd/dkdrive

      - name: Package and verify archive
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          $archive = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $expectedZip = (Get-Content "$($archive.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $expectedZip) { throw 'ZIP checksum mismatch.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath dist/verify
          $expectedExe = (Get-Content dist/verify/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash dist/verify/dkdrive.exe -Algorithm SHA256).Hash -ne $expectedExe) { throw 'EXE checksum mismatch.' }
          $info = Get-Content dist/verify/build-info.json -Raw | ConvertFrom-Json
          if ($info.modified) { throw 'Package was built from a modified checkout.' }

          $product = (Get-Item dist/verify/dkdrive.exe).VersionInfo
          if ($product.ProductName -ne 'DK-Drive' -or $product.CompanyName -ne '참빛바다') { throw 'Product identity mismatch.' }
          if ($product.ProductVersion -ne $info.version -or $product.FileVersion -ne "$($info.version).0") { throw 'Version resource mismatch.' }
          $numeric = "$($product.FileMajorPart).$($product.FileMinorPart).$($product.FileBuildPart).$($product.FilePrivatePart)"
          if ($numeric -ne "$($info.version).0") { throw 'Numeric file version mismatch.' }

      - name: Verify bundled runtime and licenses
        shell: pwsh
        run: |
          $runtime = Get-Content internal/prerequisite/winfsp.json -Raw | ConvertFrom-Json
          $msi = Join-Path (Resolve-Path dist/verify).Path $runtime.file
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $runtime.sha256) { throw 'Bundled MSI mismatch.' }
          foreach ($name in @('WinFsp-License.txt', 'Go-LICENSE.txt', 'Go-DEPENDENCIES.txt')) {
            if (-not (Test-Path "dist/verify/licenses/$name")) { throw "Missing license: $name" }
          }
          if (-not (Get-ChildItem dist/verify/licenses -Filter '*go-winfsp@*-LICENSE.txt')) { throw 'Go wrapper notice is missing.' }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP/winfsp-install.log`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            Get-Content "$env:RUNNER_TEMP/winfsp-install.log" -Tail 60
            throw "WinFsp installation failed: $($install.ExitCode)"
          }
          $env:DKDRIVE_TEST_INSTALLED_WINFSP = '1'
          go test ./cmd/dkdrive -run TestInstalledWinFspBootstrap -count=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime did not load.' }

      - name: Retain verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    # Publication requires the explicitly authorized release marker on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.9.1]')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist
      - name: Verify release provenance and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, zipfile
          archive = pathlib.Path('dist/DK-Drive-0.9.1-windows-amd64.zip')
          expected = pathlib.Path(str(archive) + '.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as z:
              info = json.loads(z.read('build-info.json').decode('utf-8-sig'))
              assert info['version'] == '0.9.1' and not info['modified']
              assert info['commit'] == os.environ['GITHUB_SHA']
              runtime = json.loads(pathlib.Path('internal/prerequisite/winfsp.json').read_text())
              assert hashlib.sha256(z.read(runtime['file'])).hexdigest() == runtime['sha256']
              assert 'licenses/WinFsp-License.txt' in z.namelist()
              expected_exe = z.read('SHA256SUMS.txt').decode().split()[0]
              assert hashlib.sha256(z.read('dkdrive.exe')).hexdigest() == expected_exe
          PYCODE
          gh release create v0.9.1 dist/*.zip dist/*.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'DK-Drive 0.9.1' --notes-file docs/releases/v0.9.1.md --draft
          gh release edit v0.9.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release edit v0.9.0 --repo "$GITHUB_REPOSITORY" --notes-file docs/releases/v0.9.0.md
